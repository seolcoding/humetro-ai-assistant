# Seoul Traffic News Site Configuration
# Domain: news.seoul.go.kr/traffic
# Last Updated: 2025-01-31

site_name: "서울시 교통 뉴스"
domain: "news.seoul.go.kr"
base_url: "https://news.seoul.go.kr/traffic"
description: "서울특별시 교통분야 누리집 - 교통 정책 및 소식"

# Article page selectors
article:
  # Main content container (리프 노드의 모든 메인 컨텐츠 포함)
  main_container:
    selector: "#sub_centent"
    attribute: null
    multiple: false
    required: true
    fallback_selectors:
      - "#sub_content"
      - ".sub-content"

  title:
    selector: "#sub_centent h3.atitle"
    attribute: null  # text content
    multiple: false
    required: true
    fallback_selectors:
      - "#sub_centent h3"
      - ".a_content h3"
      - "article h3"

  content:
    selector: "#sub_centent .a_content"
    attribute: null
    multiple: false
    required: true
    fallback_selectors:
      - "#sub_centent .content"
      - ".a_content"
      - "article .content"

  date:
    selector: ".a_meta dl dd"
    attribute: null
    multiple: false
    required: false
    fallback_selectors:
      - ".meta-date"
      - "time"

  # Metadata extraction from definition list
  # Format: <dl><dt>담당부서</dt><dd>교통기획관</dd>...</dl>
  category:
    selector: ".path a:last-child"
    attribute: null
    multiple: false
    required: false

# Attachment detection selectors
attachment:
  # Main attachment link (파일 링크)
  links:
    selector: ".a_content a[href*='/files/']"
    attribute: "href"
    multiple: true
    required: false
    fallback_selectors:
      - "a[href$='.hwpx']"
      - "a[href$='.pdf']"
      - "a[href$='.xlsx']"

  # Popup trigger button (바로보기 버튼)
  # <button class="preview_button" onclick="previewDocument(...)">바로보기</button>
  trigger_context:
    selector: ".a_content p:has(.preview_button)"
    attribute: null
    multiple: true
    required: false

  # Indicators for popup windows
  popup_indicators:
    - "class=preview_button"
    - "onclick=previewDocument"
    - "title=새 창열림"
    - "target=_blank"

  # Direct download indicators
  download_indicators:
    - "download"
    - "href*=/files/"

# Navigation selectors
navigation:
  breadcrumb:
    selector: ".path"
    attribute: null
    multiple: false
    required: false
    fallback_selectors:
      - ".breadcrumb"
      - "nav.path"

  category_links:
    selector: "#gnb_sec a"
    attribute: "href"
    multiple: true
    required: false

  pagination:
    selector: ".pagination a"
    attribute: "href"
    multiple: true
    required: false

  next_page:
    selector: ".pagination .next"
    attribute: "href"
    multiple: false
    required: false

# List/Index page selectors
list:
  article_links:
    selector: ".sub_list li a"
    attribute: "href"
    multiple: true
    required: true
    fallback_selectors:
      - ".archive-list a"
      - ".post-list a"

  article_titles:
    selector: ".sub_list li a"
    attribute: null
    multiple: true
    required: false

  article_summaries:
    selector: ".sub_list li .excerpt"
    attribute: null
    multiple: true
    required: false

  article_dates:
    selector: ".sub_list li .date"
    attribute: null
    multiple: true
    required: false

# URL patterns for page type classification
url_patterns:
  # Article URLs: /traffic/archives/[숫자]
  article_patterns:
    - ".*/traffic/archives/\\d+$"

  # List/Category URLs: /traffic/archives/category/...
  list_patterns:
    - ".*/traffic/archives/category/.*"
    - ".*/traffic/\\w+$"

  # Category pages
  category_patterns:
    - ".*/traffic/[a-z-]+$"
    - ".*/traffic/public$"
    - ".*/traffic/news-all$"

  # URLs to exclude
  exclude_patterns:
    - ".*/wp-content/.*"
    - ".*/wp-includes/.*"
    - ".*\\.css$"
    - ".*\\.js$"
    - ".*\\.jpg$"
    - ".*\\.png$"
    - ".*\\.gif$"

# Crawl rules
crawl_rules:
  max_depth: 4
  delay_between_requests: 1.5
  respect_robots_txt: true
  user_agent: "Mozilla/5.0 (compatible; SeoulTrafficCrawler/1.0)"

  allowed_domains:
    - "news.seoul.go.kr"

  excluded_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".svg"
    - ".css"
    - ".js"
    - ".woff"
    - ".woff2"
    - ".ttf"

# Custom site-specific settings
custom:
  # 메타데이터 추출 방식
  metadata_structure:
    type: "definition_list"
    container: ".a_meta dl"
    term_selector: "dt"
    definition_selector: "dd"

  # Popup document viewer function
  popup_function: "previewDocument"
  popup_function_signature: "previewDocument(url, filename)"

  # Special handling for HWP/HWPX files
  hwp_viewer_enabled: true
  hwp_viewer_url_pattern: "previewDocument\\('([^']+)'\\s*,\\s*'([^']+)'\\)"

  # Popup viewer page selectors
  popup_viewer:
    # Main content container in popup window
    content_container: "#viewerContainer"
    # Text extraction - 모든 텍스트 노드 추출
    text_selector: "#viewerContainer"
    # 개별 텍스트 요소들 (선택사항)
    text_elements: "#viewerContainer *"
    # 팝업 페이지 감지
    is_popup_indicator: "#viewerContainer"
    # 추출 방법
    extraction_method: "textContent"  # or "innerText"

  # Known file types
  supported_attachments:
    - "hwpx"
    - "hwp"
    - "pdf"
    - "xlsx"
    - "xls"
    - "docx"
    - "doc"
    - "pptx"
    - "ppt"

  # Encoding
  encoding: "utf-8"

  # Special buttons to handle
  special_buttons:
    - class: "preview_button"
      action: "popup"
      handler: "previewDocument"
    - class: "sound_button"
      action: "audio"
      handler: "playAudio"
