[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humetro-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    # Web crawling and browser automation
    "crawl4ai>=0.4.0",
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    # Data validation and schemas
    "pydantic>=2.9.0",
    # Document parsing
    "pypdf>=5.1.0",
    "openpyxl>=3.1.0",
    "olefile>=0.47",
    "python-docx>=1.1.0",
    # Async HTTP
    "aiohttp>=3.10.0",
    "faiss-cpu>=1.12.0",
]

[dependency-groups]
dev = [
    "types-requests>=2.32.4.20250913",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "reportlab>=4.2.0",  # For creating test PDFs
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
