[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humetro-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # AutoRAG first - all other deps must be compatible
    "autorag>=0.2.6",
    # Pin llama-index to 0.10.x for AutoRAG 0.2.6 compatibility
    "llama-index>=0.10.1,<0.11.0",
    "llama-index-core>=0.10.1,<0.11.0",
    # Pin pyarrow for datasets compatibility
    "pyarrow>=14.0.0,<18.0.0",
    "datasets>=2.18.0",
    # Core utilities
    "ipykernel>=6.29.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    "loguru>=0.7.3",
    # Web crawling and browser automation
    "crawl4ai>=0.4.0",
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    # Data validation and schemas
    "pydantic>=2.9.0",
    # Document parsing
    "openpyxl>=3.1.0",
    "olefile>=0.47",
    "python-docx>=1.1.0",
    # Async HTTP
    "aiohttp>=3.10.0",
    # ML/AI packages - versions will be resolved by AutoRAG
    "faiss-cpu>=1.7.0",
    "litellm>=1.0.0",
    "neo4j-graphrag>=1.8.0",
    "python-levenshtein>=0.27.3",
]

[dependency-groups]
dev = [
    "types-requests>=2.32.4.20250913",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "reportlab>=4.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
