# Ollama 모델 설정 파일
# 논문 실험에 사용할 오픈소스 LLM 모델 목록

models:
  # 논문에 명시된 정확한 4개 모델 (00_outline.md 기준)
  # "4개 오픈소스 LLM(EXAONE-3.5 7.8B/32B, Qwen 3-8B, Gemma 3-12B, GPT-OSS-20B)"

  # 1. EXAONE-3.5 7.8B (LG AI Research)
  - name: "EXAONE-3.5-7.8B"
    ollama_name: "exaone3.5:7.8b"
    size: "7.8B"
    quantization: "Q4_K_M"
    description: "LG AI Research 한국어 특화 모델 - Ko-LongRAG 최고 성능"
    category: "korean"
    vram_usage: "~15GB (8-bit)"
    tokens_per_sec: 42
    enabled: true

  # 2. Qwen 3 8B (Alibaba) - 정확한 버전
  - name: "Qwen3-8B"
    ollama_name: "qwen3:8b"  # 논문 명시 정확한 모델
    size: "8B"
    quantization: "Q4_K_M"
    description: "Alibaba Qwen 3 8B - 다국어 지원 모델"
    category: "multilingual"
    vram_usage: "~5.2GB"
    tokens_per_sec: 40
    enabled: true

  # 3. Gemma 3 12B (Google) - 정확한 버전
  - name: "Gemma3-12B"
    ollama_name: "gemma3:12b"  # 논문 명시 정확한 모델
    size: "12.2B"
    quantization: "Q4_K_M"
    description: "Google Gemma 3 12B - 효율적 아키텍처"
    category: "efficient"
    vram_usage: "~8.1GB"
    tokens_per_sec: 30
    enabled: true

  # 4. GPT-OSS-20B (오픈소스 GPT)
  - name: "GPT-OSS-20B"
    ollama_name: "gpt-oss:20b"
    size: "20B"
    quantization: "Q4_K_M"
    description: "오픈소스 GPT - MoE 아키텍처, 구조화 쿼리 특화"
    category: "large"
    vram_usage: "~18GB (4-bit)"
    tokens_per_sec: 20
    enabled: true

  # EXAONE 32B 버전 (옵션 - VRAM 제약으로 비활성화)
  - name: "EXAONE-3.5-32B"
    ollama_name: "exaone3.5:32b"
    size: "32B"
    quantization: "Q2_K"  # 매우 높은 압축 필요
    description: "LG AI Research 대규모 모델 - Ko-LongRAG 85.3점"
    category: "korean"
    vram_usage: "~22GB (2-bit)"
    tokens_per_sec: 10
    enabled: false  # 24GB VRAM 한계로 기본 비활성화

  # 한국어 SOTA 모델들 (2025년 기준 최신)
  - name: "DNA-1.0-8B"
    ollama_name: "dnotitia/dna:latest"
    size: "8B"
    quantization: "Q4_K_M"
    description: "DNA 1.0 - Llama 기반 한국어 SOTA 모델 (2025)"
    category: "korean-sota"
    vram_usage: "~5GB"
    tokens_per_sec: 45
    enabled: false  # 추가 테스트용

  - name: "SEOKDONG-Llama3.1"
    ollama_name: "kwangsuklee/seokdong-llama3.1_korean_q5_k_m"
    size: "8B"
    quantization: "Q5_K_M"
    description: "SEOKDONG - 한국어 리더보드 TOP 6 (2025.1)"
    category: "korean-sota"
    vram_usage: "~5.7GB"
    tokens_per_sec: 38
    enabled: false  # 추가 테스트용

  - name: "Bllossom-8B"
    ollama_name: "bllossom:8b"  # GGUF 버전 필요
    size: "8B"
    quantization: "Q4_K_M"
    description: "Llama3-Korean-Bllossom - LogicKor SOTA"
    category: "korean-sota"
    vram_usage: "~5.2GB"
    tokens_per_sec: 42
    enabled: false  # 추가 테스트용

  - name: "EEVE-Korean-10.8B"
    ollama_name: "eeve-korean:10.8b"  # Yanolja 모델
    size: "10.8B"
    quantization: "Q4_K_M"
    description: "EEVE-Korean - Yanolja의 한국어 특화 모델"
    category: "korean-sota"
    vram_usage: "~7GB"
    tokens_per_sec: 35
    enabled: false  # 추가 테스트용

  # 대체 모델들 (백업용)
  - name: "Solar-Pro"
    ollama_name: "solar-pro:latest"
    size: "22.1B"
    quantization: "Q4_K_M"
    description: "Upstage Solar Pro - 한국어 성능 우수"
    category: "korean"
    enabled: false  # 백업 모델

  - name: "Mistral-7B"
    ollama_name: "mistral:7b-instruct"
    size: "7B"
    quantization: "Q4_K_M"
    description: "Mistral AI 효율적인 모델"
    category: "efficient"
    enabled: false

  - name: "Phi-3.5"
    ollama_name: "phi3.5:3.8b"
    size: "3.8B"
    quantization: "Q4_K_M"
    description: "Microsoft 소형 고성능 모델"
    category: "small"
    enabled: false

# 테스트 프롬프트 설정
test_prompts:
  - prompt: "서울시 120 다산콜센터는 무엇인가요?"
    category: "정보"

  - prompt: "코로나19 백신 접종 예약은 어떻게 하나요?"
    category: "절차"

  - prompt: "주민등록등본을 온라인으로 발급받는 방법을 알려주세요."
    category: "민원"

# 실험 설정
experiment:
  max_tokens: 256
  temperature: 0.1
  top_p: 0.9
  repeat_penalty: 1.1
  timeout: 120  # seconds
  batch_size: 5  # 동시 처리할 쿼리 수

# 평가 메트릭
metrics:
  - "response_time"
  - "tokens_per_second"
  - "memory_usage"
  - "accuracy"  # RAGAS 평가용
  - "relevance"  # RAGAS 평가용