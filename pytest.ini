[pytest]
# Pytest configuration for attachment system tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for different test types
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require browser, network)
    slow: Slow tests (may take >10 seconds)
    asyncio: Async tests

# Async configuration
asyncio_mode = auto

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs =
    .git
    .venv
    __pycache__
    *.egg-info
    build
    dist
    node_modules

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if using pytest-cov)
# [tool:pytest]
# addopts = --cov=crawler --cov-report=html --cov-report=term
